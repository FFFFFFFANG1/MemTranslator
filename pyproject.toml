[project]
name = "memtranslator"
version = "0.2.0"
description = "A translator between you and your agents: learns how you want tasks done and compiles it into the request itself."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92",
    "fastapi>=0.115",
    "huggingface-hub>=0.28",
    "httpx>=0.27",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "tokenizers>=0.21",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memtranslator = "memtranslator_bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtranslator"]

[tool.hatch.build.targets.wheel.force-include]
"web/index.html" = "memtranslator/web/index.html"
"src/memtranslator_bootstrap.py" = "memtranslator_bootstrap.py"

[tool.hatch.build.targets.sdist]
include = ["src/memtranslator", "src/memtranslator_bootstrap.py", "web/index.html", "README.md", "pyproject.toml"]
