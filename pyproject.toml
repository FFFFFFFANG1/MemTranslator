[project]
name = "memtranslator"
version = "0.1.0"
description = "A translator between you and your agents: learns how you want tasks done and compiles it into the request itself."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
memory-embedding = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
hotkey = [
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-ApplicationServices>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtranslator"]
