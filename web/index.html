<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemTranslator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23181818'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 12h17m-4-4 4 4-4 4M25 20H8m4-4-4 4 4 4'/%3E%3C/g%3E%3C/svg%3E">
<script>
try {
  const initialTheme = localStorage.getItem("memtranslator-theme");
  document.documentElement.dataset.theme = ["light", "dark"].includes(initialTheme)
    ? initialTheme : "system";
} catch { document.documentElement.dataset.theme = "system"; }
</script>
<style>
:root{
  color-scheme:light;
  --ink:#181818;
  --paper:#ffffff;
  --canvas:#f7f7f8;
  --well:#f7f7f8;
  --line:#e1e1e1;
  --line-soft:#ececec;
  --dim:#666666;
  --faint:#929292;
  --muted:#777777;
  --muted-soft:#898989;
  --muted-strong:#555555;
  --surface:#fafafa;
  --surface-hover:#f5f5f5;
  --raised:#ffffff;
  --control:#ededee;
  --control-active:#e5e5e6;
  --focus:#aaaaaa;
  --disabled:#eeeeee;
  --primary:#181818;
  --primary-hover:#303030;
  --on-primary:#ffffff;
  --shadow:rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f1f1f1;--paper:#151516;--canvas:#0e0e0f;--well:#1d1d1f;
  --line:#3a3a3c;--line-soft:#2b2b2d;--dim:#b7b7b8;--faint:#77777a;
  --muted:#aaaaac;--muted-soft:#89898c;--muted-strong:#d0d0d2;
  --surface:#1a1a1c;--surface-hover:#212123;--raised:#242426;
  --control:#252527;--control-active:#333336;--focus:#707074;
  --disabled:#2a2a2d;--primary:#f1f1f1;--primary-hover:#d9d9da;
  --on-primary:#111112;--shadow:rgba(0,0,0,.35);
}
@media(prefers-color-scheme:dark){
  :root[data-theme="system"]{
    color-scheme:dark;
    --ink:#f1f1f1;--paper:#151516;--canvas:#0e0e0f;--well:#1d1d1f;
    --line:#3a3a3c;--line-soft:#2b2b2d;--dim:#b7b7b8;--faint:#77777a;
    --muted:#aaaaac;--muted-soft:#89898c;--muted-strong:#d0d0d2;
    --surface:#1a1a1c;--surface-hover:#212123;--raised:#242426;
    --control:#252527;--control-active:#333336;--focus:#707074;
    --disabled:#2a2a2d;--primary:#f1f1f1;--primary-hover:#d9d9da;
    --on-primary:#111112;--shadow:rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-weight:400;
  transition:background .2s ease,color .2s ease;
}
#app{
  width:100%;height:100vh;margin:0 auto;
  display:grid;grid-template-rows:68px minmax(0,1fr);
  grid-template-areas:"header" "panel";
  padding:0 clamp(18px,3vw,56px) 28px;
}
header{
  grid-area:header;display:flex;align-items:center;gap:22px;
  padding:0 4px;border-bottom:1px solid var(--line-soft);
  animation:fadedown .35s ease-out both;
}
.wordmark{
  display:flex;align-items:center;gap:10px;
  font-size:17px;font-weight:620;letter-spacing:-.02em;
}
.wordmark em{font-style:normal;font-weight:620}
.brand-mark{width:30px;height:30px;display:grid;place-items:center}
.brand-mark svg{width:28px;height:28px;color:var(--ink)}
.tagline{
  color:var(--muted);font-size:10px;font-weight:500;
  letter-spacing:.08em;
}
.page-nav{display:flex;align-items:center;gap:3px;margin-left:12px}
.page-nav button{
  padding:6px 9px;border:0;border-radius:7px;background:transparent;
  color:var(--muted-soft);font-size:10.5px;font-weight:570;
}
.page-nav button:hover{color:var(--ink);background:var(--control)}
.page-nav button[aria-pressed="true"]{color:var(--ink);background:var(--control-active)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.settings-button{
  width:31px;height:31px;display:grid;place-items:center;padding:0;
  background:transparent;border:1px solid transparent;border-radius:8px;
  color:var(--muted);
}
.settings-button svg{width:16px;height:16px}
.settings-button:hover{color:var(--ink);background:var(--control)}
.settings-button[aria-pressed="true"]{
  color:var(--ink);background:var(--raised);border-color:var(--line);
  box-shadow:0 1px 2px var(--shadow);
}
.theme-switch,.language-switch{
  display:flex;gap:2px;padding:3px;
  background:var(--control);border:1px solid var(--line-soft);border-radius:9px;
}
.theme-switch button,.language-switch button{
  min-width:31px;padding:5px 7px;border:0;border-radius:6px;
  background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--sans);font-size:10px;font-weight:580;
}
.theme-switch button{display:flex;align-items:center;justify-content:center;gap:4px}
.theme-switch svg{width:12px;height:12px}
.theme-switch button[aria-pressed="true"],.language-switch button[aria-pressed="true"]{
  color:var(--ink);background:var(--raised);box-shadow:0 1px 2px var(--shadow);
}
.theme-switch button:hover,.language-switch button:hover{color:var(--ink)}

#panel{
  grid-area:panel;width:100%;min-height:0;
  justify-self:stretch;margin-top:20px;padding:clamp(22px,2.4vw,38px);
  display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line-soft);
  border-radius:14px;animation:fadeup .4s .05s ease-out both;
}
#panel h2{
  font-size:18px;font-weight:630;letter-spacing:-.02em;
}
#panel .sub{
  margin:5px 0 18px;color:var(--muted-soft);
  font-size:10px;font-weight:500;letter-spacing:.04em;
}
#panel .sub b{color:var(--muted-strong);font-weight:620}
.page{display:flex;flex:1;min-height:0;flex-direction:column}
.page[hidden]{display:none}
#add-form{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(180px,.65fr) auto;
  gap:8px;margin-bottom:14px;
}
#add-input{
  grid-column:1/-1;min-width:0;padding:10px 12px;
  background:var(--well);border:1px solid var(--line);
  border-radius:8px;outline:0;color:var(--ink);
  font-family:var(--sans);font-size:12.5px;
}
#add-input:focus{
  border-color:var(--focus);background:var(--raised);
  box-shadow:0 0 0 2px var(--shadow);
}
#add-input::placeholder{color:var(--faint)}
.field-group,.edit-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field-group>label,.edit-field>label{
  color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;
}
.meta-control{display:flex;align-items:center;gap:7px;min-width:0}
.meta-input{
  width:100%;min-width:0;padding:9px 10px;
  background:var(--well);border:1px solid var(--line);border-radius:8px;
  outline:0;color:var(--ink);font-family:var(--mono);font-size:10.5px;
}
.meta-input:focus{border-color:var(--focus);background:var(--raised);box-shadow:0 0 0 2px var(--shadow)}
.meta-input:disabled{color:var(--faint);background:var(--disabled)}
.meta-input::placeholder{color:var(--faint)}
.check-control{
  display:flex;align-items:center;gap:4px;flex:0 0 auto;
  color:var(--muted-strong);font-family:var(--mono);font-size:9.5px;cursor:pointer;
}
.check-control input{width:13px;height:13px;accent-color:var(--ink)}
button{
  font-family:var(--sans);font-weight:570;
  letter-spacing:0;white-space:nowrap;cursor:pointer;
}
#add-btn{
  align-self:end;min-height:36px;padding:0 17px;background:var(--primary);
  border:1px solid var(--primary);border-radius:8px;
  color:var(--on-primary);font-size:12px;
}
#add-btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
#add-btn:disabled{opacity:.4;cursor:default}
#memory-notice{
  min-height:18px;margin:-5px 0 8px;
  color:var(--dim);font-size:10px;font-weight:500;
}
#memory-notice.error{color:var(--ink)}
#allowlist-notice{
  min-height:18px;margin:-5px 0 8px;
  color:var(--dim);font-size:10px;font-weight:500;
}
#allowlist-notice.error{color:var(--ink)}
#settings-notice{
  min-height:18px;margin:0 0 4px;color:var(--dim);font-size:10px;font-weight:500;
}
#settings-notice.error{color:var(--ink)}
#req-list{
  flex:1;min-height:0;overflow-y:auto;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.req{
  margin:0 0 10px;padding:17px 18px;
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;transition:border-color .18s,background .18s;
}
.req:hover{border-color:var(--line);background:var(--surface-hover)}
.req .text{
  color:var(--ink);font-size:15.5px;
  font-weight:500;line-height:1.55;word-break:break-word;
}
.req .date{
  margin-top:7px;color:var(--faint);
  font-family:var(--mono);font-size:10px;
}
.req .metadata{
  display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:11px;
  color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.5;
}
.req .metadata b{color:var(--muted-strong);font-family:var(--sans);font-weight:620}
.req .item-actions,.allow-entry .item-actions{
  display:flex;align-items:center;gap:6px;margin-top:9px
}
.req .item-action,.allow-entry .item-action{
  padding:5px 9px;background:var(--raised);
  border:1px solid var(--line);border-radius:6px;
  color:var(--dim);font-size:10px;font-weight:550;
}
.req .item-action.modify:hover,.req .item-action.save:hover,
.req .item-action.restore:hover,.req .item-action.cancel:hover,
.allow-entry .item-action.modify:hover,.allow-entry .item-action.save:hover,
.allow-entry .item-action.cancel:hover{
  background:var(--control);border-color:var(--line);color:var(--ink);
}
.req .item-action.delete:hover,.allow-entry .item-action.delete:hover{
  background:var(--primary);border-color:var(--primary);color:var(--on-primary);
}
.edit-input{
  display:block;width:100%;min-height:64px;resize:vertical;
  padding:11px;background:var(--raised);border:1px solid var(--focus);
  border-radius:8px;outline:0;color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  box-shadow:0 0 0 2px var(--shadow);
}
.edit-fields{display:grid;grid-template-columns:1fr 1fr minmax(180px,.65fr);gap:8px;margin-top:10px}
.req.retired{background:var(--surface);border-color:var(--line-soft)}
.req.retired .text{color:var(--muted);text-decoration:line-through}
#retired-toggle{
  padding:8px 2px;background:none;border:0;
  color:var(--muted);font-size:11px;font-weight:520;text-align:left;
}
#retired-toggle:hover{color:var(--ink)}
.empty-state{
  padding:18px;background:var(--surface);
  border:1px dashed var(--line);border-radius:10px;
  color:var(--muted);font-size:12.5px;line-height:1.75;
}
.empty-state .seed{
  display:inline-block;margin-top:10px;padding:6px 10px;
  background:var(--raised);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font-family:var(--mono);font-size:11px;
}
.empty-state .seed:hover{background:var(--control)}
#allowlist-add-form{
  display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1.5fr) auto;
  gap:8px;margin-bottom:14px;align-items:end;
}
.source-select,.bucket-select{
  width:100%;min-height:35px;padding:8px 10px;
  background:var(--well);border:1px solid var(--line);border-radius:8px;
  outline:0;color:var(--ink);font-family:var(--sans);font-size:11px;
}
.source-select:focus,.bucket-select:focus{border-color:var(--focus);background:var(--raised)}
#allowlist-add-btn{
  min-height:35px;padding:0 15px;background:var(--primary);
  border:1px solid var(--primary);border-radius:8px;color:var(--on-primary);font-size:12px;
}
#allowlist-add-btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
#allowlist-add-btn:disabled{opacity:.4;cursor:default}
#allowlist-list{
  flex:1;min-height:0;overflow-y:auto;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.allow-entry{
  margin:0 0 8px;padding:12px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:10px;
}
.allow-head{display:flex;align-items:center;gap:7px;min-width:0}
.allow-label{font-size:14px;font-weight:590;word-break:break-word}
.source-badge{
  display:inline-flex;padding:3px 6px;background:var(--control);border-radius:5px;
  color:var(--dim);font-family:var(--mono);font-size:8.5px;font-weight:600;
  letter-spacing:.02em;
}
.source-badge.default{background:var(--raised);border:1px solid var(--line);padding:2px 5px}
.allow-patterns{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;
}
.allow-patterns code{
  padding:4px 6px;background:var(--raised);border:1px solid var(--line-soft);
  border-radius:5px;color:var(--muted-strong);font-family:var(--mono);font-size:9.5px;
  word-break:break-all;
}
.allow-entry .item-actions{display:flex;gap:6px;margin-top:9px}
.allow-edit-fields{
  display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1.5fr);
  gap:8px;
}
.settings-stack{display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.settings-card{
  padding:16px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;
}
.settings-card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:13px;
}
.settings-card h3{font-size:13px;font-weight:630;letter-spacing:-.01em}
.settings-status{
  padding:3px 7px;background:var(--control);border-radius:999px;
  color:var(--dim);font-family:var(--mono);font-size:8.5px;font-weight:600;
}
.settings-fields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}
.settings-fields .wide{grid-column:1/-1}
.settings-note{
  margin-top:10px;color:var(--muted);font-size:10px;line-height:1.55;
}
.settings-note code{font-family:var(--mono);font-size:9.5px;color:var(--muted-strong)}
.settings-actions{display:flex;align-items:center;gap:7px;margin-top:13px}
.settings-primary,.settings-secondary{
  min-height:34px;padding:0 13px;border-radius:8px;font-size:11px;
}
.settings-primary{background:var(--primary);border:1px solid var(--primary);color:var(--on-primary)}
.settings-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.settings-secondary{background:var(--raised);border:1px solid var(--line);color:var(--ink)}
.settings-secondary:hover{background:var(--control);color:var(--ink)}
.settings-primary:disabled,.settings-secondary:disabled{opacity:.4;cursor:default}
@keyframes fadeup{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}
@keyframes fadedown{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:none}
}
@media(max-width:900px){
  #add-form{grid-template-columns:1fr 1fr}
  #add-btn{min-height:38px}
  .edit-fields{grid-template-columns:1fr 1fr}
  .edit-field.bucket-field{grid-column:1/-1}
  .theme-switch .theme-copy{display:none}
  .theme-switch button{width:29px;min-width:29px;padding:5px}
}
@media(max-width:640px){
  #app{padding:0 14px 14px;grid-template-rows:60px minmax(0,1fr)}
  header{padding:0 2px;gap:12px}
  .wordmark{font-size:16px}.brand-mark{width:28px;height:28px}
  .tagline{display:none}
  .page-nav{margin-left:0}
  .page-nav button{padding:6px 7px;font-size:10px}
  #panel{margin-top:14px;padding:18px;border-radius:12px}
  #add-form{grid-template-columns:1fr}
  #add-input{grid-column:auto}
  #add-btn{min-height:38px}
  .edit-fields{grid-template-columns:1fr}
  .edit-field.bucket-field{grid-column:auto}
  #allowlist-add-form,.allow-edit-fields,.settings-fields{grid-template-columns:1fr}
  .settings-fields .wide{grid-column:auto}
}
@media(max-width:500px){
  .wordmark>span:last-child{display:none}
  .header-actions{gap:5px}
  .language-switch button{min-width:28px;padding:5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wordmark"><span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M7 14h25m-6-6 6 6-6 6M33 26H8m6-6-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span><span><em>Mem</em>Translator</span></div>
    <div class="tagline" data-i18n="tagline">记忆编译器 · 连接你与智能体</div>
    <nav class="page-nav" data-i18n-aria-label="pageNavigation">
      <button id="nav-memory" type="button" aria-pressed="true" data-i18n="navMemory">Memory</button>
      <button id="nav-allowlist" type="button" aria-pressed="false" data-i18n="navAllowlist">白名单</button>
    </nav>
    <div class="header-actions">
      <div class="theme-switch" role="group" data-i18n-aria-label="themeSwitcher">
        <button id="theme-system" type="button" aria-pressed="true" data-theme-choice="system" data-i18n-title="themeSystem">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1.5" stroke="currentColor"/><path d="M6 13.5h4M8 11v2.5" stroke="currentColor" stroke-linecap="round"/></svg>
          <span class="theme-copy" data-i18n="themeSystem">自动</span>
        </button>
        <button id="theme-light" type="button" aria-pressed="false" data-theme-choice="light" data-i18n-title="themeLight">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.5" stroke="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13" stroke="currentColor" stroke-linecap="round"/></svg>
          <span class="theme-copy" data-i18n="themeLight">亮</span>
        </button>
        <button id="theme-dark" type="button" aria-pressed="false" data-theme-choice="dark" data-i18n-title="themeDark">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12.8 10.2A5.5 5.5 0 0 1 5.8 3.1a5.5 5.5 0 1 0 7 7.1Z" stroke="currentColor" stroke-linejoin="round"/></svg>
          <span class="theme-copy" data-i18n="themeDark">暗</span>
        </button>
      </div>
      <button id="nav-settings" class="settings-button" type="button"
              aria-pressed="false" data-i18n-title="settings"
              data-i18n-aria-label="settings">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
          <path d="M19 13.5v-3l-2.1-.6a7.5 7.5 0 0 0-.7-1.6l1.1-1.9-2.1-2.1-1.9 1.1a7.5 7.5 0 0 0-1.6-.7L11.1 2h-3l-.6 2.1a7.5 7.5 0 0 0-1.6.7L4 3.7 1.9 5.8 3 7.7a7.5 7.5 0 0 0-.7 1.6l-2.1.6v3l2.1.6c.2.6.4 1.1.7 1.6L1.9 17l2.1 2.1L5.9 18c.5.3 1 .5 1.6.7l.6 2.1h3l.6-2.1c.6-.2 1.1-.4 1.6-.7l1.9 1.1 2.1-2.1-1.1-1.9c.3-.5.5-1 .7-1.6l2.1-.6Z" transform="translate(2.4 1.1) scale(.8)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="language-switch" role="group" data-i18n-aria-label="languageSwitcher">
        <button id="lang-zh" type="button" aria-pressed="true" data-i18n-title="chinese">中</button>
        <button id="lang-en" type="button" aria-pressed="false" data-i18n-title="english">EN</button>
      </div>
    </div>
  </header>

  <aside id="panel">
    <section id="memory-page" class="page">
    <h2 data-i18n="memoryTitle">Memory</h2>
    <div class="sub"><span data-i18n="memorySubtitle">任务应当如何完成</span> · <b id="req-count">0</b> <span data-i18n="activeUnit">条生效</span></div>
    <form id="add-form">
      <input id="add-input" data-i18n-placeholder="newMemoryPlaceholder" autocomplete="off">
      <div class="field-group">

  savedLanguage = localStorage.getItem("memtranslator-language") || "";
  savedTheme = localStorage.getItem("memtranslator-theme") || "";
} catch {}

  "task_goal", "reasoning_policy", "deliverables", "output_contract",
  "communication_style", "execution_policy",
];
const BUCKET_I18N = {
  task_goal: "bucketTaskGoal",
  reasoning_policy: "bucketReasoningPolicy",
  deliverables: "bucketDeliverables",
  output_contract: "bucketOutputContract",
  communication_style: "bucketCommunicationStyle",
  execution_policy: "bucketExecutionPolicy",
};

const state = {
  requirements: [],
  buckets: DEFAULT_BUCKETS.slice(),
  allowlist: [],
  showRetired: false,
  editingId: null,
  editingAllowlistId: null,
  settings: null,
  activePage: "memory",
  language: savedLanguage === "en" ? "en" : "zh",
  theme: ["light", "dark"].includes(savedTheme) ? savedTheme : "system",
  panelNotice: null,
  allowlistNotice: null,
  settingsNotice: null,
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = (key, vars = {}) => {
  const template = STRINGS[state.language][key] ?? STRINGS.en[key] ?? key;
  return template.replace(/\{(\w+)\}/g, (_, name) => String(vars[name] ?? ""));
};
const fmtDate = (ts) => new Date(ts * 1000).toLocaleDateString(
  state.language === "zh" ? "zh-CN" : "en-US", {month:"2-digit", day:"2-digit"});
const bucketLabel = (bucket) => bucket
  ? t(BUCKET_I18N[bucket] || "bucketUnclassified")
  : t("bucketUnclassified");
const bucketOptionsHtml = (selected = "") => ["", ...state.buckets]
  .map(bucket => `<option value="${esc(bucket)}" ${bucket === selected ? "selected" : ""}>${esc(bucketLabel(bucket))}${bucket ? ` · ${esc(bucket)}` : ""}</option>`)
  .join("");

function renderBucketOptions() {
  const select = $("#add-bucket");
  if (!select) return;
  const selected = select.value;
  select.innerHTML = bucketOptionsHtml(
    state.buckets.includes(selected) ? selected : "");
}

function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll("[data-theme-choice]").forEach((button) => {
    button.setAttribute(
      "aria-pressed", String(button.dataset.themeChoice === state.theme));
  });
}

function setTheme(theme) {
  state.theme = ["light", "dark"].includes(theme) ? theme : "system";
  try { localStorage.setItem("memtranslator-theme", state.theme); } catch {}
  applyTheme();
}

async function requestJSON(url, options = {}) {
  const response = await fetch(url, options);
  const raw = await response.text();
  let payload = null;
  if (raw) {
    try { payload = JSON.parse(raw); } catch { payload = null; }
  }
  if (!response.ok) {
    throw new Error(payload?.detail || `HTTP ${response.status}`);
  }
  return payload;
}

function renderPanelNotice() {
  const notice = state.panelNotice;
  const el = $("#memory-notice");
  el.className = notice?.kind === "error" ? "error" : "";
  el.textContent = notice ? t(notice.key, notice.vars) : "";
}

function showPanelNotice(kind, key, vars = {}) {
  state.panelNotice = {kind, key, vars};
  renderPanelNotice();
}

function renderAllowlistNotice() {
  const notice = state.allowlistNotice;
  const el = $("#allowlist-notice");
  el.className = notice?.kind === "error" ? "error" : "";
  el.textContent = notice ? t(notice.key, notice.vars) : "";
}

function showAllowlistNotice(kind, key, vars = {}) {
  state.allowlistNotice = {kind, key, vars};
  renderAllowlistNotice();
}

function renderSettingsNotice() {
  const notice = state.settingsNotice;
  const el = $("#settings-notice");
  el.className = notice?.kind === "error" ? "error" : "";
  el.textContent = notice ? t(notice.key, notice.vars) : "";
}

  state.settingsNotice = {kind, key, vars};
  renderSettingsNotice();
}

function setPage(page) {
  state.activePage = ["memory", "allowlist", "settings"].includes(page)
    ? page : "memory";
  $("#memory-page").hidden = state.activePage !== "memory";
  $("#allowlist-page").hidden = state.activePage !== "allowlist";
  $("#settings-page").hidden = state.activePage !== "settings";
  $("#nav-memory").setAttribute("aria-pressed", String(state.activePage === "memory"));
  $("#nav-allowlist").setAttribute("aria-pressed", String(state.activePage === "allowlist"));
  $("#nav-settings").setAttribute("aria-pressed", String(state.activePage === "settings"));
  if (state.activePage === "allowlist") {
    $("#allowlist-label").focus();
  } else if (state.activePage === "settings") {
    loadSettings().then(() => $("#llm-api-format").focus());
  } else {
    $("#add-input").focus();
  }
}

function applyLanguage() {
  document.documentElement.lang = state.language === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll("[data-i18n-aria-label]").forEach((el) => {
    el.setAttribute("aria-label", t(el.dataset.i18nAriaLabel));
  });
  $("#lang-zh").setAttribute("aria-pressed", String(state.language === "zh"));
  $("#lang-en").setAttribute("aria-pressed", String(state.language === "en"));
  $("#nav-memory").setAttribute("aria-pressed", String(state.activePage === "memory"));
  $("#nav-allowlist").setAttribute("aria-pressed", String(state.activePage === "allowlist"));
  $("#nav-settings").setAttribute("aria-pressed", String(state.activePage === "settings"));
  renderBucketOptions();
  applyTheme();
  renderRequirements();
  renderAllowlist();
  renderPanelNotice();
  renderAllowlistNotice();
  renderSettings();
  renderSettingsNotice();
}

function setLanguage(language) {
  state.language = language;
  try { localStorage.setItem("memtranslator-language", language); } catch {}
  applyLanguage();
}

/* ---------- requirements panel ---------- */
async function loadRequirements() {
  try {
    const payload = await requestJSON("/api/requirements");
    state.requirements = payload.requirements || [];
    state.buckets = Array.isArray(payload.buckets) && payload.buckets.length
      ? payload.buckets : DEFAULT_BUCKETS.slice();
    renderBucketOptions();
    renderRequirements();
  } catch (error) {
    showPanelNotice("error", "loadFailed", {message: error.message});
  }
}

const itemKinds = (item) => Array.isArray(item.kinds) ? item.kinds : [];
const itemIsAny = (item) => itemKinds(item).includes("any");
const itemIsGlobal = (item) => item.scope_mode === "global";
const itemWorkKindText = (item) => itemKinds(item)
  .filter(kind => kind !== "any").join(", ");
const itemScopeText = (item) => {
  if (itemIsGlobal(item)) return "";
  if (item.applies_when) return String(item.applies_when);
  const entries = Object.entries(item.scope || {});
  return entries.map(([key, value]) => `${key}=${value}`).join(", ");
};
const itemWorkKindDisplay = (item) => itemIsAny(item)
  ? t("any") : (itemWorkKindText(item) || t("metadataUnset"));
const itemScopeDisplay = (item) => itemIsGlobal(item)
  ? t("global") : (itemScopeText(item) || t("metadataUnset"));
const metadataHtml = (item) => `<div class="metadata">
  <span><b>${esc(t("workKind"))}</b> · ${esc(itemWorkKindDisplay(item))}</span>
  <span><b>${esc(t("scope"))}</b> · ${esc(itemScopeDisplay(item))}</span>
  <span><b>${esc(t("bucket"))}</b> · ${esc(bucketLabel(item.bucket))}${item.bucket ? ` · ${esc(item.bucket)}` : ""}</span>
</div>`;

function activeRequirementHtml(item) {
  if (state.editingId === item.id) {
    return `<div class="req editing" data-id="${esc(item.id)}">
      <textarea class="edit-input" aria-label="${esc(t("modify"))}">${esc(item.text)}</textarea>
      <div class="edit-fields">
        <div class="edit-field">
          <label>${esc(t("workKind"))}</label>
          <div class="meta-control">
            <input class="meta-input edit-work-kind" value="${esc(itemWorkKindText(item))}" placeholder="${esc(t("workKindPlaceholder"))}" ${itemIsAny(item) ? "disabled" : ""}>
            <label class="check-control"><input class="edit-any" type="checkbox" ${itemIsAny(item) ? "checked" : ""}>${esc(t("any"))}</label>
          </div>
        </div>
        <div class="edit-field">
          <label>${esc(t("scope"))}</label>
          <div class="meta-control">
            <input class="meta-input edit-scope" value="${esc(itemScopeText(item))}" placeholder="${esc(t("scopePlaceholder"))}" ${itemIsGlobal(item) ? "disabled" : ""}>
            <label class="check-control"><input class="edit-global" type="checkbox" ${itemIsGlobal(item) ? "checked" : ""}>${esc(t("global"))}</label>
          </div>
        </div>
        <div class="edit-field bucket-field">
          <label>${esc(t("bucket"))}</label>
          <select class="bucket-select edit-bucket">${bucketOptionsHtml(item.bucket || "")}</select>
        </div>
      </div>
      <div class="item-actions">
        <button class="item-action save" type="button" data-action="save">${esc(t("save"))}</button>
        <button class="item-action cancel" type="button" data-action="cancel">${esc(t("cancel"))}</button>
      </div>
    </div>`;
  }
  return `<div class="req" data-id="${esc(item.id)}">
    <div class="text">${esc(item.text)}</div>
    ${metadataHtml(item)}
    <div class="date">${fmtDate(item.updated_at || item.created_at)}</div>
    <div class="item-actions">
      <button class="item-action modify" type="button" data-action="edit">${esc(t("modify"))}</button>
      <button class="item-action delete" type="button" data-action="delete">${esc(t("delete"))}</button>
    </div>
  </div>`;
}

function retiredRequirementHtml(item) {
  return `<div class="req retired" data-id="${esc(item.id)}">
    <div class="text">${esc(item.text)}</div>
    ${metadataHtml(item)}
    <div class="item-actions">
      <button class="item-action restore" type="button" data-action="restore">${esc(t("restore"))}</button>
    </div>
  </div>`;
}

function renderRequirements() {
  const active = state.requirements.filter(r => r.status === "active");
  const retired = state.requirements.filter(r => r.status === "retired");
  reqCountEl.textContent = active.length;

  let html = "";
  if (!active.length) {
    html = `<div class="empty-state">
      ${esc(t("emptyTitle"))}<br>${esc(t("emptyGuide"))}
      <button class="seed" id="seed-btn" type="button">${esc(t("seed"))}</button>
    </div>`;
  } else {
    html = active.slice().reverse().map(activeRequirementHtml).join("");
  }

  if (retired.length) {
    html += `<button id="retired-toggle" type="button">${state.showRetired ? "▾" : "▸"} ${esc(t("deletedToggle", {count: retired.length}))}</button>`;
    if (state.showRetired) {
      html += retired.slice().reverse().map(retiredRequirementHtml).join("");
    }
  }
  reqListEl.innerHTML = html;

  const seed = $("#seed-btn");
  if (seed) seed.onclick = () => {
    $("#add-input").value = t("seed");
    $("#add-work-kind").value = "email";
    $("#add-any").checked = false;
    $("#add-scope").value = state.language === "zh" ? "所有邮件任务" : "all email tasks";
    $("#add-global").checked = false;
    $("#add-bucket").value = "output_contract";
    syncAddMetadataControls();
    $("#add-input").focus();
  };
  reqListEl.querySelectorAll('[data-action="edit"]').forEach((button) => {
    button.onclick = () => {
      state.editingId = button.closest(".req").dataset.id;
      state.panelNotice = null;
      renderRequirements();
      const input = reqListEl.querySelector(".edit-input");
      input?.focus();
      input?.select();
    };
  });
  reqListEl.querySelectorAll('[data-action="cancel"]').forEach((button) => {
    button.onclick = () => { state.editingId = null; renderRequirements(); };
  });
  reqListEl.querySelectorAll('[data-action="save"]').forEach((button) => {
    button.onclick = () => {
      const row = button.closest(".req");
      saveRequirement(
        row.dataset.id,
        row.querySelector(".edit-input").value,
        row.querySelector(".edit-any").checked
          ? "any" : row.querySelector(".edit-work-kind").value,
        row.querySelector(".edit-global").checked
          ? "global" : row.querySelector(".edit-scope").value,
        row.querySelector(".edit-bucket").value);
    };
  });
  reqListEl.querySelectorAll('[data-action="delete"]').forEach((button) => {
    button.onclick = () => deleteRequirement(button.closest(".req").dataset.id);
  });
  reqListEl.querySelectorAll('[data-action="restore"]').forEach((button) => {
    button.onclick = () => restoreRequirement(button.closest(".req").dataset.id);
  });
  reqListEl.querySelectorAll(".req.editing").forEach((row) => {
    const any = row.querySelector(".edit-any");
    const global = row.querySelector(".edit-global");
    const workKind = row.querySelector(".edit-work-kind");
    const scope = row.querySelector(".edit-scope");
    const sync = () => {
      if (global.checked) any.checked = true;
      workKind.disabled = any.checked;
      scope.disabled = global.checked;
    };
    any.onchange = () => {
      if (!any.checked && global.checked) global.checked = false;
      sync();
    };
    global.onchange = sync;
    sync();
  });
  reqListEl.querySelectorAll(".edit-input,.edit-work-kind,.edit-scope,.edit-bucket").forEach((input) => {
    input.onkeydown = (event) => {
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === "Escape") {
        state.editingId = null;
        renderRequirements();
      } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        input.closest(".req").querySelector('[data-action="save"]').click();
      }
    };
  });
  const toggle = $("#retired-toggle");
  if (toggle) toggle.onclick = () => {
    state.showRetired = !state.showRetired;
    renderRequirements();
  };
  renderPanelNotice();
}

async function saveRequirement(id, text, workKind, scopeText, bucket) {
  text = text.trim();
  if (!text) {
    showPanelNotice("error", "memoryEmpty");
    return;
  }
  workKind = workKind.trim();
  scopeText = scopeText.trim();
  if (!workKind || !scopeText) {
    showPanelNotice("error", "metadataRequired");
    return;
  }
  try {
    await requestJSON(`/api/requirements/${id}`, {
      method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text, work_kind: workKind, scope_text: scopeText, bucket,
      }),
    });
    state.editingId = null;
    await loadRequirements();
    showPanelNotice("success", "updateSuccess");
  } catch (error) {
    showPanelNotice("error", "updateFailed", {message: error.message});
  }
}

async function deleteRequirement(id) {
  if (!window.confirm(t("confirmDelete"))) return;
  try {
    await requestJSON(`/api/requirements/${id}`, {method: "DELETE"});
    if (state.editingId === id) state.editingId = null;
    await loadRequirements();
    showPanelNotice("success", "deleteSuccess");
  } catch (error) {
    showPanelNotice("error", "deleteFailed", {message: error.message});
  }
}

async function restoreRequirement(id) {
  try {
    await requestJSON(`/api/requirements/${id}`, {
      method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({status: "active"}),
    });
    await loadRequirements();
    showPanelNotice("success", "restoreSuccess");
  } catch (error) {
    showPanelNotice("error", "restoreFailed", {message: error.message});
  }
}

function syncAddMetadataControls() {
  const any = $("#add-any"), global = $("#add-global");
  if (global.checked) any.checked = true;
  $("#add-work-kind").disabled = any.checked;
  $("#add-scope").disabled = global.checked;
}

$("#add-any").onchange = () => {
  if (!$("#add-any").checked && $("#add-global").checked)
    $("#add-global").checked = false;
  syncAddMetadataControls();
};
$("#add-global").onchange = syncAddMetadataControls;

$("#add-form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("#add-input").value.trim();
  const workKind = $("#add-any").checked
    ? "any" : $("#add-work-kind").value.trim();
  const scopeText = $("#add-global").checked
    ? "global" : $("#add-scope").value.trim();
  const bucket = $("#add-bucket").value;
  if (!text) {
    showPanelNotice("error", "memoryEmpty");
    return;
  }
  const button = $("#add-btn");
  button.disabled = true;
  try {
    const result = await requestJSON("/api/requirements", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, work_kind: workKind, scope_text: scopeText, bucket}),
    });
    $("#add-input").value = "";
    $("#add-work-kind").value = "";
    $("#add-scope").value = "";
    $("#add-bucket").value = "";
    $("#add-any").checked = false;
    $("#add-global").checked = false;
    syncAddMetadataControls();
    await loadRequirements();
    showPanelNotice("success", result?.queued ? "routeAQueued" : "createSuccess");
  } catch (error) {
    showPanelNotice("error", "createFailed", {message: error.message});
  } finally {
    button.disabled = false;
  }
};

/* ---------- source allowlist page ---------- */
const splitSourcePatterns = (value) => String(value || "")
  .split(/[,，\n]/).map(item => item.trim()).filter(Boolean);

async function loadAllowlist() {
  try {
    const payload = await requestJSON("/api/source-allowlist");
    state.allowlist = payload.entries || [];
    renderAllowlist();
  } catch (error) {
    showAllowlistNotice("error", "sourceLoadFailed", {message: error.message});
  }
}

function allowlistEntryHtml(entry) {
  const patterns = Array.isArray(entry.patterns) ? entry.patterns : [];
  if (state.editingAllowlistId === entry.id) {
    return `<div class="allow-entry editing" data-id="${esc(entry.id)}">
      <div class="allow-edit-fields">
        <div class="edit-field">
          <label>${esc(t("sourceLabel"))}</label>
          <input class="meta-input edit-source-label" value="${esc(entry.label)}">
        </div>
        <div class="edit-field">
          <label>${esc(t("sourceType"))}</label>
          <select class="source-select edit-source-kind">
            <option value="app" ${entry.kind === "app" ? "selected" : ""}>${esc(t("sourceApp"))}</option>
            <option value="web" ${entry.kind === "web" ? "selected" : ""}>${esc(t("sourceWeb"))}</option>
          </select>
        </div>
        <div class="edit-field">
          <label>${esc(t("sourceMatches"))}</label>
          <input class="meta-input edit-source-patterns" value="${esc(patterns.join(", "))}">
        </div>
      </div>
      <div class="item-actions">
        <button class="item-action save" type="button" data-source-action="save">${esc(t("save"))}</button>
        <button class="item-action cancel" type="button" data-source-action="cancel">${esc(t("cancel"))}</button>
      </div>
    </div>`;
  }
  return `<div class="allow-entry" data-id="${esc(entry.id)}">
    <div class="allow-head">
      <span class="allow-label">${esc(entry.label)}</span>
      <span class="source-badge">${esc(entry.kind === "web" ? t("sourceWeb") : t("sourceApp"))}</span>
      ${entry.is_default ? `<span class="source-badge default">${esc(t("defaultSource"))}</span>` : ""}
    </div>
    <div class="allow-patterns">${patterns.map(pattern => `<code>${esc(pattern)}</code>`).join("")}</div>
    <div class="item-actions">
      <button class="item-action modify" type="button" data-source-action="edit">${esc(t("modify"))}</button>
      <button class="item-action delete" type="button" data-source-action="delete">${esc(t("delete"))}</button>
    </div>
  </div>`;
}

function renderAllowlist() {
  allowlistCountEl.textContent = state.allowlist.length;
  allowlistListEl.innerHTML = state.allowlist.length
    ? state.allowlist.map(allowlistEntryHtml).join("")
    : `<div class="empty-state">${esc(t("emptyAllowlist"))}</div>`;

  allowlistListEl.querySelectorAll('[data-source-action="edit"]').forEach(button => {
    button.onclick = () => {
      state.editingAllowlistId = button.closest(".allow-entry").dataset.id;
      state.allowlistNotice = null;
      renderAllowlist();
      const input = allowlistListEl.querySelector(".edit-source-label");
      input?.focus();
      input?.select();
    };
  });
  allowlistListEl.querySelectorAll('[data-source-action="cancel"]').forEach(button => {
    button.onclick = () => {
      state.editingAllowlistId = null;
      renderAllowlist();
    };
  });
  allowlistListEl.querySelectorAll('[data-source-action="save"]').forEach(button => {
    button.onclick = () => {
      const row = button.closest(".allow-entry");
      saveAllowlistEntry(
        row.dataset.id,
        row.querySelector(".edit-source-label").value,
        row.querySelector(".edit-source-kind").value,
        row.querySelector(".edit-source-patterns").value);
    };
  });
  allowlistListEl.querySelectorAll('[data-source-action="delete"]').forEach(button => {
    button.onclick = () => deleteAllowlistEntry(
      button.closest(".allow-entry").dataset.id);
  });
  allowlistListEl.querySelectorAll(
    ".edit-source-label,.edit-source-kind,.edit-source-patterns"
  ).forEach(input => {
    input.onkeydown = (event) => {
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === "Escape") {
        state.editingAllowlistId = null;
        renderAllowlist();
      } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        input.closest(".allow-entry").querySelector(
          '[data-source-action="save"]').click();
      }
    };
  });
  renderAllowlistNotice();
}

async function saveAllowlistEntry(id, label, kind, patternsText) {
  label = label.trim();
  const patterns = splitSourcePatterns(patternsText);
  if (!label || !patterns.length) {
    showAllowlistNotice("error", "sourceRequired");
    return;
  }
  try {
    await requestJSON(`/api/source-allowlist/${id}`, {
      method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({label, kind, patterns}),
    });
    state.editingAllowlistId = null;
    await loadAllowlist();
    showAllowlistNotice("success", "sourceUpdateSuccess");
  } catch (error) {
    showAllowlistNotice("error", "sourceUpdateFailed", {message: error.message});
  }
}

async function deleteAllowlistEntry(id) {
  if (!window.confirm(t("confirmSourceDelete"))) return;
  try {
    await requestJSON(`/api/source-allowlist/${id}`, {method: "DELETE"});
    if (state.editingAllowlistId === id) state.editingAllowlistId = null;
    await loadAllowlist();
    showAllowlistNotice("success", "sourceDeleteSuccess");
  } catch (error) {
    showAllowlistNotice("error", "sourceDeleteFailed", {message: error.message});
  }
}

$("#allowlist-add-form").onsubmit = async (event) => {
  event.preventDefault();
  const label = $("#allowlist-label").value.trim();
  const kind = $("#allowlist-kind").value;
  const patterns = splitSourcePatterns($("#allowlist-patterns").value);
  if (!label || !patterns.length) {
    showAllowlistNotice("error", "sourceRequired");
    return;
  }
  const button = $("#allowlist-add-btn");
  button.disabled = true;
  try {
    await requestJSON("/api/source-allowlist", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({label, kind, patterns}),
    });
    $("#allowlist-label").value = "";
    $("#allowlist-patterns").value = "";
    await loadAllowlist();
    showAllowlistNotice("success", "sourceCreateSuccess");
    $("#allowlist-label").focus();
  } catch (error) {
    showAllowlistNotice("error", "sourceCreateFailed", {message: error.message});
  } finally {
    button.disabled = false;
  }
};

/* ---------- runtime settings page ---------- */
function renderSettings() {
  if (!state.settings) {
    $("#llm-key-status").textContent = "";
    $("#embedding-mode-status").textContent = "";
    $("#embedding-inheritance").textContent = "";
    return;
  }
  const llm = state.settings.llm || {};
  const embedding = state.settings.embedding || {};
  $("#llm-key-status").textContent = t(
    llm.has_api_key ? "configured" : "notConfigured");
  $("#embedding-mode-status").textContent = t(
    embedding.mode === "remote" ? "remoteMode" : "localMode");
  const inherited = [];
  if (embedding.mode === "remote" && embedding.uses_llm_api_key)
    inherited.push(t("llmKeyField"));
  if (embedding.mode === "remote" && embedding.uses_llm_base_url)
    inherited.push(t("llmBaseField"));
  $("#embedding-inheritance").textContent = inherited.length
    ? t("embeddingUsesLlm", {fields: inherited.join(" + ")})
    : (embedding.mode === "remote" ? t("noInheritance") : "");
}

function populateSettings(settings) {
  state.settings = settings;
  const llm = settings.llm || {};
  const embedding = settings.embedding || {};
  $("#llm-api-format").value = llm.api_format || "openai-compatible";
  $("#llm-model").value = llm.model || "";
  $("#llm-base-url").value = llm.base_url || "";
  $("#llm-api-key").value = llm.api_key || "";
  $("#embedding-model").value = embedding.model || "";
  $("#embedding-base-url").value = embedding.base_url || "";
  $("#embedding-api-key").value = embedding.api_key || "";
  renderSettings();
}

async function loadSettings() {
  try {
    populateSettings(await requestJSON("/api/settings"));
  } catch (error) {
    showSettingsNotice("error", "settingsLoadFailed", {message: error.message});
  }
}

$("#llm-settings-form").onsubmit = async (event) => {
  event.preventDefault();
  const model = $("#llm-model").value.trim();
  if (!model) {
    showSettingsNotice("error", "modelRequired");
    return;
  }
  const button = $("#llm-save-btn");
  button.disabled = true;
  try {
    const settings = await requestJSON("/api/settings/llm", {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        api_format: $("#llm-api-format").value,
        model,
        base_url: $("#llm-base-url").value.trim(),
        api_key: $("#llm-api-key").value.trim(),
      }),
    });
    populateSettings(settings);
    showSettingsNotice("success", "llmSaved");
  } catch (error) {
    showSettingsNotice("error", "llmSaveFailed", {message: error.message});
  } finally {
    button.disabled = false;
  }
};

$("#embedding-settings-form").onsubmit = async (event) => {
  event.preventDefault();
  const model = $("#embedding-model").value.trim();
  if (!model) {
    showSettingsNotice("error", "modelRequired");
    return;
  }
  const button = $("#embedding-save-btn");
  button.disabled = true;
  try {
    const settings = await requestJSON("/api/settings/embedding", {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model,
        base_url: $("#embedding-base-url").value.trim(),
        api_key: $("#embedding-api-key").value.trim(),
      }),
    });
    populateSettings(settings);
    showSettingsNotice("success", "embeddingSaved");
  } catch (error) {
    showSettingsNotice("error", "embeddingSaveFailed", {message: error.message});
  } finally {
    button.disabled = false;
  }
};

$("#embedding-default-btn").onclick = async () => {
  const button = $("#embedding-default-btn");
  const originalKey = "useDefaultEmbedding";
  button.disabled = true;
  button.textContent = t("downloadingDefault");
  try {
    const result = await requestJSON("/api/settings/embedding/default", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}",
    });
    populateSettings(result);
    showSettingsNotice("success", result.downloaded
      ? "embeddingDefaultReady" : "embeddingDefaultReused");
  } catch (error) {
    showSettingsNotice("error", "embeddingSaveFailed", {message: error.message});
  } finally {
    button.disabled = false;
    button.textContent = t(originalKey);
  }
};

/* ---------- wiring + boot ---------- */
$("#add-input").addEventListener("keydown", (event) => {
  if ((event.isComposing || event.keyCode === 229) && event.key === "Enter")
    event.preventDefault();
});
syncAddMetadataControls();
$("#lang-zh").onclick = () => setLanguage("zh");
$("#lang-en").onclick = () => setLanguage("en");
document.querySelectorAll("[data-theme-choice]").forEach((button) => {
  button.onclick = () => setTheme(button.dataset.themeChoice);
});
$("#nav-memory").onclick = () => setPage("memory");
$("#nav-allowlist").onclick = () => setPage("allowlist");
$("#nav-settings").onclick = () => setPage("settings");

applyLanguage();
Promise.all([loadRequirements(), loadAllowlist(), loadSettings()]).finally(() => {
  if (state.activePage === "memory") $("#add-input").focus();
});
</script>
</body>
</html>
