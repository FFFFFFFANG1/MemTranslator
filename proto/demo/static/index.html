<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemTranslator demo</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #fff; --ink: #1a1a1a; --muted: #8a8a86;
    --line: #e6e4df; --accent: #2f6b4f; --accent-soft: #e8f1ec;
    --warn: #9a6b2f; --warn-soft: #f6ecdd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1e1e1c; --ink: #ececea; --muted: #8f8f8a;
            --line: #32322f; --accent: #7fb89d; --accent-soft: #24352c;
            --warn: #d0a468; --warn-soft: #383024; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; font-weight: 600; }
  header .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat-col { flex: 1.6; display: flex; flex-direction: column; min-width: 0; }
  #mem-col { flex: 1; border-left: 1px solid var(--line); overflow-y: auto;
             padding: 14px 16px; background: var(--panel); }
  #stream { flex: 1; overflow-y: auto; padding: 18px; display: flex;
            flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 10px;
         white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent-soft); }
  .msg.assistant { align-self: flex-start; background: var(--panel);
                   border: 1px solid var(--line); }
  .msg .tag { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  #composer { border-top: 1px solid var(--line); padding: 12px 18px 16px;
              display: flex; flex-direction: column; gap: 8px; }
  #applied-bar { display: none; flex-wrap: wrap; gap: 6px; align-items: center;
                 font-size: 12.5px; }
  #applied-bar.show { display: flex; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 99px;
          padding: 2px 10px; font-size: 12px; }
  .chip.noop { background: var(--warn-soft); color: var(--warn); }
  #restore { color: var(--muted); cursor: pointer; text-decoration: underline;
             font-size: 12px; }
  textarea { width: 100%; resize: vertical; border: 1px solid var(--line);
             border-radius: 10px; background: var(--panel); color: var(--ink);
             padding: 10px 12px; font: inherit; }
  #input { min-height: 74px; }
  #input.polished { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #content-wrap { display: none; }
  #content-wrap.show { display: block; }
  #content { min-height: 60px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13.5px;
           cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .ghost { color: var(--muted); font-size: 12.5px; background: none; border: none;
           text-decoration: underline; padding: 4px; }
  #mem-col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
                color: var(--muted); margin-bottom: 10px; }
  .mem { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
         margin-bottom: 9px; font-size: 13.5px; }
  .mem .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px;
               font-size: 11.5px; color: var(--muted); }
  .mem .badge { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .mem.superseded, .mem.retired { opacity: .5; }
  .mem q { display: block; color: var(--muted); font-size: 12px; margin-top: 4px;
           quotes: "「" "」"; }
  #ops-log { font-size: 12.5px; color: var(--muted); padding: 6px 18px;
             border-top: 1px dashed var(--line); display: none; white-space: pre-wrap; }
  #ops-log.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>MemTranslator</h1>
  <span style="color:var(--muted);font-size:12.5px">translator: haiku · downstream: sonnet</span>
  <div class="spacer"></div>
  <button id="end-session" title="Run the ≤2-call write path over this session">End session → extract memory</button>
</header>
<main>
  <div id="chat-col">
    <div id="stream"></div>
    <div id="ops-log"></div>
    <div id="composer">
      <div id="applied-bar"></div>
      <textarea id="input" placeholder="Type a request… Translate compiles your standing requirements into it; you can edit the result freely before sending."></textarea>
      <div id="content-wrap"><textarea id="content" placeholder="Attached content (never rewritten by the translator)"></textarea></div>
      <div class="row">
        <button id="translate" class="primary">Translate</button>
        <button id="send">Send</button>
        <button id="toggle-content" class="ghost">attach content</button>
        <span id="status" style="color:var(--muted);font-size:12.5px"></span>
      </div>
    </div>
  </div>
  <div id="mem-col">
    <h2>Requirement memory</h2>
    <div id="mems"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let originalText = null;   // pre-translation text, restorable
let lastPolished = null;

function setStatus(t) { $("status").textContent = t; }

function addMsg(role, text, tag) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (tag) { const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; div.appendChild(s); }
  div.appendChild(document.createTextNode(text));
  $("stream").appendChild(div);
  $("stream").scrollTop = $("stream").scrollHeight;
}

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function refreshMems() {
  const d = await (await fetch("/memories")).json();
  $("mems").innerHTML = "";
  for (const e of d.entries) {
    const div = document.createElement("div");
    div.className = "mem " + e.status;
    if (e.source === "default") div.style.opacity = ".65";
    div.innerHTML = `<div>${e.requirement}</div>
      <div class="meta"><span class="badge">${e.status}</span>
        ${e.source === "default" ? '<span class="badge">default</span>' : ""}
        <span class="badge">${e.polarity}</span>
        <span>strength ${e.strength}</span></div>
      <div class="meta">scope: ${e.scope}</div>`;
    for (const q of e.quotes) {
      const quote = document.createElement("q"); quote.textContent = q; div.appendChild(quote);
    }
    $("mems").appendChild(div);
  }
}

$("translate").onclick = async () => {
  const text = $("input").value.trim();
  if (!text) return;
  setStatus("translating…"); $("translate").disabled = true;
  try {
    const d = await api("/translate", { request: text, content: $("content").value });
    $("applied-bar").className = "show"; $("applied-bar").innerHTML = "";
    if (d.noop) {
      $("applied-bar").innerHTML = `<span class="chip noop">no-op</span>
        <span style="color:var(--muted)">${d.rationale || "no requirement applies"}</span>`;
    } else {
      originalText = text; lastPolished = d.polished_request;
      $("input").value = d.polished_request;
      $("input").classList.add("polished");
      for (const m of d.applied) {
        const c = document.createElement("span"); c.className = "chip";
        c.textContent = m.requirement.slice(0, 60) + (m.requirement.length > 60 ? "…" : "");
        c.title = m.mid; $("applied-bar").appendChild(c);
      }
      const r = document.createElement("span"); r.id = "restore";
      r.textContent = "restore original"; r.onclick = restore;
      $("applied-bar").appendChild(r);
    }
    setStatus(d.noop ? "" : "polished — edit freely, then Send");
  } catch (e) { setStatus("translate failed: " + e.message); }
  $("translate").disabled = false;
  refreshMems();  // last_applied_at may have changed
};

function restore() {
  if (originalText !== null) { $("input").value = originalText; }
  $("input").classList.remove("polished");
  $("applied-bar").className = ""; $("applied-bar").innerHTML = "";
  setStatus("restored");
}

$("send").onclick = async () => {
  const text = $("input").value.trim();
  if (!text) return;
  const content = $("content").value;
  const full = content ? text + "\n\n" + content : text;
  const edited = lastPolished !== null && text !== lastPolished;
  addMsg("user", text, lastPolished !== null ? (edited ? "polished + user-edited" : "polished") : null);
  $("input").value = ""; $("content").value = "";
  $("input").classList.remove("polished");
  $("applied-bar").className = ""; $("applied-bar").innerHTML = "";
  const orig = originalText, polishedForSend = lastPolished;
  originalText = null; lastPolished = null;
  setStatus("waiting for downstream agent…");
  try {
    const d = await api("/send", { text: full, request: text, original: orig || "", polished: polishedForSend || "" });
    addMsg("assistant", d.reply);
    setStatus("");
  } catch (e) { setStatus("send failed: " + e.message); }
};

$("end-session").onclick = async () => {
  setStatus("running write path…");
  try {
    const d = await api("/end_session");
    const log = $("ops-log");
    log.className = "show";
    log.textContent = d.ops.length
      ? "write path: " + d.ops.map(o => `${o.op}${o.target ? "→" + o.target : ""} [${o.signal}] ${o.requirement}`).join("\n")
      : "write path: no durable requirement signal in this session (1 LLM call spent)";
    setStatus("");
    refreshMems();
  } catch (e) { setStatus("end_session failed: " + e.message); }
};

$("toggle-content").onclick = () => {
  $("content-wrap").classList.toggle("show");
  $("toggle-content").textContent = $("content-wrap").classList.contains("show") ? "hide content" : "attach content";
};

$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("send").onclick(); }
});

refreshMems();
</script>
</body>
</html>
